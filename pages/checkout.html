<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | LARRYSCENT</title>
    <meta name="description" content="Enter your delivery details to complete your LARRYSCENT order." />
    <meta name="theme-color" content="#684454" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LARRYSCENT" />
    <meta property="og:title" content="Checkout | LARRYSCENT" />
    <meta property="og:description" content="Enter your delivery details to complete your LARRYSCENT order." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23684454'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EL%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script src="../js/layout.js" defer></script>
    <script src="../js/products.js" defer></script>
    <script src="../js/cart.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/checkout.js" defer></script>
  </head>
  <body data-page="checkout" data-root="../">
    <main id="main">
      <section class="page-hero">
        <p class="eyebrow">Almost yours</p>
        <h1>Checkout</h1>
        <p>Complete your delivery details.</p>
      </section>
      <section class="section checkout-layout">
        <form id="checkout-form" class="form-card">
          <h2>Delivery information</h2>
          <label for="customer-name">Full name</label>
          <input id="customer-name" name="name" autocomplete="name" required placeholder="Your full name" />
          <label for="customer-email">Email</label>
          <input id="customer-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          <label for="customer-phone">Phone number</label>
          <input id="customer-phone" name="phone" type="tel" autocomplete="tel" required placeholder="080..." />
          <label for="customer-address">Delivery address</label>
          <textarea id="customer-address" name="address" autocomplete="street-address" rows="4" required placeholder="Street, city, state"></textarea>
          <button class="button button-full" type="submit">Place order</button>
          <p class="small-note">
            No payment is taken online. We will contact you to confirm your order and delivery.
          </p>
          <p id="checkout-message" class="form-message" aria-live="polite"></p>
        </form>
        <aside class="summary-card" aria-label="Your order">
          <h2>Your order</h2>
          <div id="checkout-summary"></div>
          <p class="summary-line">
            <span>Total</span><strong id="checkout-total">₦0</strong>
          </p>
        </aside>
      </section>
    </main>
  </body>
</html>

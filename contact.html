<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | LARRYSCENT</title>
    <meta name="description" content="Questions about a fragrance or your order? Contact the LARRYSCENT team." />
    <meta name="theme-color" content="#684454" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LARRYSCENT" />
    <meta property="og:title" content="Contact | LARRYSCENT" />
    <meta property="og:description" content="Questions about a fragrance or your order? Contact the LARRYSCENT team." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23684454'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EL%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/layout.js" defer></script>
    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body data-page="contact" data-root="">
    <main id="main">
      <section class="page-hero">
        <p class="eyebrow">We would love to hear from you</p>
        <h1>Let's talk fragrance.</h1>
        <p>Questions about a scent or your order? Send us a message.</p>
      </section>
      <section class="section contact-layout">
        <div class="contact-details">
          <p class="eyebrow">Get in touch</p>
          <h2>We're here to help.</h2>
          <p>
            Send a message using the form, or email us directly. We'll get back
            to you as soon as we can.
          </p>
          <div class="contact-detail">
            <strong>Email</strong>
            <a href="mailto:hello@larryscent.com">hello@larryscent.com</a>
          </div>
          <div class="contact-detail">
            <strong>Location</strong><span>Nigeria</span>
          </div>
        </div>
        <form id="contact-form" class="form-card">
          <label for="name">Your name</label>
          <input id="name" name="name" autocomplete="name" required placeholder="Enter your name" />
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          <label for="subject">Subject</label>
          <input id="subject" name="subject" required placeholder="How can we help?" />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="Write your message"></textarea>
          <button class="button" type="submit">Send message</button>
          <p id="contact-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
